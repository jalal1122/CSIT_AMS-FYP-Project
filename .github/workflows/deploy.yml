name: Deploy CSIT_AMS to cPanel

# Strictly triggers on pushes to the main branch
# Pushes to 'dev', feature branches, or pull requests will NOT trigger deployment
on:
  push:
    branches:
      - main

# Prevent concurrent deployments that could clash over FTP uploads
concurrency:
  group: production-cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: 🌐 Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔨 Compile Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_URL: https://csitattendanceapi.csitfmcs.com.pk
        run: npm run build

      - name: 🚀 Upload Frontend to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_FRONTEND_DIR || 'csitattendance.csitfmcs.com.pk/' }}
          local-dir: ./frontend/dist/

  deploy-backend:
    name: ⚡ Deploy Backend API & Reload Passenger
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Package Backend Files
        run: |
          mkdir deploy-backend
          rsync -av --exclude='node_modules' --exclude='src/tests' --exclude='.env' ./backend/ deploy-backend/
          # Ensure tmp/restart.txt is created with fresh timestamp so FTP-Deploy-Action never skips it
          mkdir -p deploy-backend/tmp
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-backend/tmp/restart.txt

      - name: 🚀 Upload Backend to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_BACKEND_DIR || 'backend-csitattendance/' }}
          local-dir: ./deploy-backend/

      - name: 🔄 SSH Passenger App Restart & Dependency Update (Optional)
        if: env.SSH_HOST != ''
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.CPANEL_BACKEND_DIR }}"
            CLEAN_DIR=$(echo "$TARGET_DIR" | sed 's|^/||;s|/$||')
            if [ -n "$CLEAN_DIR" ] && [ -d "$HOME/$CLEAN_DIR" ]; then
              cd "$HOME/$CLEAN_DIR"
            elif [ -d "$HOME/backend-csitattendance" ]; then
              cd "$HOME/backend-csitattendance"
            elif [ -d "$HOME/csitattendanceapi.csitfmcs.com.pk" ]; then
              cd "$HOME/csitattendanceapi.csitfmcs.com.pk"
            fi
            npm install --omit=dev
            mkdir -p tmp && touch tmp/restart.txt
